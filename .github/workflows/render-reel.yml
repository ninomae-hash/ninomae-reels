# ninomae ONLINE リール動画を作って GitHub Pages に公開する
# GAS（Google Apps Script）から依頼が来ると動きます。手動でテストすることもできます。
name: リール動画を作成

on:
  repository_dispatch:
    types: [render-reel]
  workflow_dispatch:
    inputs:
      payload:
        description: "テスト用の内容（JSON）。そのまま「Run workflow」でテスト動画を作れます"
        required: true
        default: '{"job_id":"00000000-manual-test","images":["https://baseec-img-mng.akamaized.net/images/item/origin/06a86453fa49fdb3fbf50258dc7fdb6e.jpg","https://baseec-img-mng.akamaized.net/images/item/origin/f2ba113c9aaaa487da5773aba541ffb4.jpg"],"slides":["小さな花束に、想いを込めて","水やり不要で長く楽しめる","誕生日や記念日の贈り物に"],"title":"プリザーブドフラワーブーケ｜花束 ピンク","price":"¥9,240（税込）","brand":"ninomae ONLINE"}'

permissions:
  contents: write

concurrency:
  group: render-reel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: プログラムを取り出す
        uses: actions/checkout@v4

      - name: 必要なソフト（動画編集・日本語フォント）を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk
          pip install --quiet pillow

      - name: 動画を作る
        env:
          PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || toJson(github.event.client_payload) }}
        run: python3 scripts/render_reel.py

      - name: GitHub Pages に公開する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VIDEO=$(ls out/*.mp4 | head -n1)
          NAME=$(basename "$VIDEO")
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir site && cd site
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi

          mkdir -p reels
          cp "../$VIDEO" reels/
          # 新しい順に6本だけ残す（ファイル名が日時で始まるので、名前の降順＝新しい順）
          ls reels/*.mp4 | sort -r | tail -n +7 | xargs -r rm -f
          touch .nojekyll
          printf '<!doctype html><meta charset="utf-8"><title>ninomae reels</title><p>ninomae ONLINE reels</p>\n' > index.html

          # 履歴を残さず常に1コミットだけにする（動画でリポジトリが大きくならないように）
          git checkout -q --orphan publish
          git add -A
          git commit -q -m "reel: $NAME"
          git push -q -f origin publish:gh-pages

          echo "公開URL（反映まで1〜2分かかります）: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/reels/$NAME"
